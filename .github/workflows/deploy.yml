name: Deploy to GitHub Pages

# Deploys only a commit on main that passed the whole CI workflow (lint, typecheck,
# unit tests, build, Playwright e2e).
#
# One-time setup, so a fresh repository does not show a failing deploy:
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → Variables: PAGES_ENABLED = true.
# Until then the jobs are skipped (grey), not failed, for automatic and manual runs alike.
# A manual run (workflow_dispatch) deploys without waiting for CI; run it on main, because
# the github-pages environment only accepts deployments from the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build with the Pages base path
        run: npm run build
        env:
          # "/<repo>" for a project site, "" for a <user>.github.io site; Vite needs a trailing slash.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
